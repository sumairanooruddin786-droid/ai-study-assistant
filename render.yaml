services:
  - type: web
    name: ai-study-assistant-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/generate_sample_pdfs.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-3-mini
      - key: CORS_ORIGINS
        value: "*"
